<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>CI/CD pipeline flow</title>
<desc>Developer pushes to GitHub, opens a pull request, GitHub Actions runs tests, builds the app, and runs a security scan in parallel, then builds Docker images, pushes to Docker Hub, and deploys to Kubernetes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">GitHub repository</text>
<line x1="340" y1="64" x2="340" y2="98" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="98" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Pull request / merge</text>
<line x1="340" y1="142" x2="340" y2="176" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="176" width="280" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">GitHub Actions CI/CD</text>
<line x1="340" y1="220" x2="340" y2="240" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="150" y1="240" x2="530" y2="240" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="150" y1="240" x2="150" y2="256" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="240" x2="340" y2="256" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="530" y1="240" x2="530" y2="256" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="60" y="256" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Run tests</text>
<rect x="250" y="256" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Build application</text>
<rect x="440" y="256" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Security scan</text>

<line x1="150" y1="300" x2="150" y2="330" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="340" y1="300" x2="340" y2="330" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="530" y1="300" x2="530" y2="330" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="150" y1="330" x2="530" y2="330" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="340" y1="330" x2="340" y2="352" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="352" width="280" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="374" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Build Docker images</text>
<line x1="340" y1="396" x2="340" y2="430" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="430" width="280" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Docker Hub registry</text>
<line x1="340" y1="474" x2="340" y2="498" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="180" y="498" width="320" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="520" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">Kubernetes deployment pipeline</text>
</svg>
