<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>Server monitoring flow</title>
<desc>A client server runs a monitoring agent that collects CPU, RAM, and disk usage, sends it over HTTP to the backend API, which stores it in PostgreSQL and serves it to the frontend dashboard.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="230" y="20" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Client server</text>
<line x1="340" y1="64" x2="340" y2="98" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="98" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Monitoring agent</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Collects CPU, RAM, disk</text>
<line x1="340" y1="154" x2="340" y2="188" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="230" y="188" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">HTTP API</text>
<line x1="340" y1="232" x2="340" y2="266" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="230" y="266" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Backend API</text>
<line x1="340" y1="310" x2="340" y2="344" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="230" y="344" width="220" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PostgreSQL</text>
<line x1="340" y1="388" x2="340" y2="412" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="412" width="280" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="434" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend dashboard</text>
</svg>
