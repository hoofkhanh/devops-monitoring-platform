<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>Server management layer</title>
<desc>The Ubuntu server splits into two sides: Docker as the container runtime running Docker Compose, and Linux tools for system management running bash scripts, including install, deploy, backup, health-check, and cleanup scripts.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="60" y="20" width="560" height="360" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="80" y="46" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Ubuntu server</text>

<line x1="220" y1="70" x2="220" y2="94" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="460" y1="70" x2="460" y2="94" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="110" y="94" width="220" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Docker</text>
<text x="220" y="134" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Container runtime</text>

<rect x="350" y="94" width="220" height="56" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="460" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Linux tools</text>
<text x="460" y="134" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">System management</text>

<line x1="220" y1="150" x2="220" y2="174" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="460" y1="150" x2="460" y2="174" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="110" y="174" width="220" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Docker Compose</text>

<rect x="350" y="174" width="220" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="460" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Bash scripts</text>

<line x1="460" y1="214" x2="460" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="350" y="238" width="220" height="120" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="460" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">install.sh</text>
<text x="460" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">deploy.sh</text>
<text x="460" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">backup.sh</text>
<text x="460" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">health-check.sh</text>
<text x="460" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">cleanup.sh</text>
</svg>
