<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>Local Docker Compose architecture</title>
<desc>On the developer machine, a Docker Compose environment runs an Nginx container in front of the frontend and backend services, with the backend connecting to PostgreSQL, so the full system can run locally before deploying to Kubernetes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="60" y="40" width="560" height="300" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="80" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Developer machine</text>

<rect x="90" y="90" width="500" height="220" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="110" y="112" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Docker Compose environment</text>

<rect x="250" y="130" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Nginx container</text>

<line x1="290" y1="170" x2="230" y2="204" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="390" y1="170" x2="450" y2="204" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="130" y="204" width="180" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="220" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend</text>

<rect x="360" y="204" width="180" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="450" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Backend</text>

<line x1="450" y1="244" x2="450" y2="266" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="360" y="266" width="180" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="450" y="286" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PostgreSQL</text>
</svg>
