<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>Kubernetes cluster topology</title>
<desc>A user request comes in over HTTPS to the Kubernetes ingress, routed by the Nginx ingress controller to either the frontend service or backend service, which forward to frontend pods or backend API pods. Backend pods connect to a PostgreSQL service backed by PostgreSQL pods.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="290" y="20" width="100" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User</text>
<text x="410" y="80" font-family="sans-serif" font-size="12" fill="#5F5E5A">HTTPS</text>
<line x1="340" y1="60" x2="340" y2="96" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="96" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="116" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Kubernetes ingress</text>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Nginx ingress controller</text>

<line x1="260" y1="152" x2="260" y2="186" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="152" x2="420" y2="186" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="150" y="186" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend service</text>
<rect x="310" y="186" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="420" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Backend service</text>

<line x1="260" y1="230" x2="260" y2="264" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="230" x2="420" y2="264" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="150" y="264" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="284" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend pods</text>
<text x="260" y="304" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">React app</text>

<rect x="310" y="264" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="420" y="284" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Backend API pods</text>
<text x="420" y="304" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Go / Python API</text>

<line x1="420" y1="320" x2="420" y2="344" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="310" y="344" width="220" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="420" y="366" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PostgreSQL service</text>

<line x1="420" y1="388" x2="420" y2="412" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="310" y="412" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="420" y="432" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PostgreSQL pods</text>
<text x="420" y="452" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">StatefulSet + PVC</text>
</svg>
