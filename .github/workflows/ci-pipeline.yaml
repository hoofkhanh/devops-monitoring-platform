name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Run formatting check
        run: test -z "$(gofmt -l .)"

      - name: Run static analysis
        run: go vet ./...

      - name: Build (verify compiles)
        run: go build ./...

      - name: Run tests
        run: go test ./...

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests when configured
        run: npm run test --if-present

      - name: Run type check
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # security:
  #   name: Security scan
  #   needs: [test-backend, test-frontend]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out source
  #       uses: actions/checkout@v4
  #
  #     - name: Scan images with Trivy
  #       uses: aquasecurity/trivy-action@master
  #       with:
  #         scan-type: fs
  #         scan-ref: .
  #
  #     - name: Scan code with SonarQube
  #       uses: SonarSource/sonarqube-scan-action@v4
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    name: Build and push Docker images
    needs: [test-backend, test-frontend]
    # When the security job above is enabled, add it to `needs` before building images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-monitoring-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-monitoring-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-monitoring-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-monitoring-frontend:${{ github.sha }}
