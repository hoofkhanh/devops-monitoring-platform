services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ../backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: devops-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend_1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: "hoofkhanh/devops-monitoring-backend:latest"
    container_name: devops-backend-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}

  backend_2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: "hoofkhanh/devops-monitoring-backend:latest"
    container_name: devops-backend-2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: "hoofkhanh/devops-monitoring-frontend:latest"
    container_name: devops-frontend
    restart: unless-stopped
    depends_on:
      - backend_1
      - backend_2
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_FRONTEND_PORT: ${VITE_FRONTEND_PORT}
    ports:
      - "${VITE_FRONTEND_PORT}:5173"

  nginx:
    image: "nginx:latest"
    container_name: devops-nginx
    depends_on:
      - backend_1
      - backend_2
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
