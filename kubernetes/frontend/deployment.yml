apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-monitoring-platform
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: hoofkhanh/devops-monitoring-frontend:latest
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              valueFrom: 
                configMapKeyRef:
                  name: app-config
                  key: VITE_API_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 20
