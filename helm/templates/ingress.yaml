apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "myapp.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | default "hoofkhanh.com" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "myapp.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.targetPort }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "myapp.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.BACKEND_PORT }}
