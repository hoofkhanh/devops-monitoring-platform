apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-database
  namespace: {{ .Values.namespace }}
  labels:
    app: database
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: database
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.db.service.port }}
      targetPort: {{ .Values.db.service.port }}
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-pgadmin
  namespace: {{ .Values.namespace }}
  labels:
    app: pgadmin
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "myapp.fullname" . }}-pgadmin
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.db.PGADMIN_PORT }}
      targetPort: {{ .Values.db.PGADMIN_TARGET_PORT }}
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "myapp.fullname" . }}-database
  namespace: {{ .Values.namespace }}
  labels:
    app: database
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "myapp.fullname" . }}-database
  replicas: 1
  selector:
    matchLabels:
      app: database
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: database
        {{- include "myapp.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.service.targetPort }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "myapp.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "myapp.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "myapp.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "myapp.fullname" . }}-config
                  key: POSTGRES_PORT
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: {{ .Values.db.storage.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "myapp.fullname" . }}-pgadmin-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.pgadmin.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.fullname" . }}-pgadmin
  namespace: {{ .Values.namespace }}
  labels:
    app: pgadmin
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "myapp.fullname" . }}-pgadmin
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "myapp.fullname" . }}-pgadmin
        {{- include "myapp.labels" . | nindent 8 }}
    spec:
      containers:
        - name: pgadmin
          image: "{{ .Values.db.pgadmin.image.repository }}:{{ .Values.db.pgadmin.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.PGADMIN_TARGET_PORT }}
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "myapp.fullname" . }}-secrets
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "myapp.fullname" . }}-secrets
                  key: PGADMIN_DEFAULT_PASSWORD
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          resources:
            {{- toYaml .Values.db.pgadmin.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.db.PGADMIN_TARGET_PORT }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.db.PGADMIN_TARGET_PORT }}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: {{ include "myapp.fullname" . }}-pgadmin-pvc
